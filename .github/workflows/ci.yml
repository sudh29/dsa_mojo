name: CI - Mojo DSA Test Suite

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    name: Build & Run Mojo Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync Dependencies
        run: uv sync

      - name: Verify Mojo Compiler Version
        run: uv run mojo --version

      - name: Run Test Suite (All 16 Categories + Shared Package Tests)
        run: uv run python test_all.py --warn-error
